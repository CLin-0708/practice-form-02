<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书借阅登记</title>
</head>
<body>
  <header>
    <h1>图书借阅登记</h1>
    <p>请如实填写借阅信息，方便图书管理</p>
  </header>
  <nav>
    <a href="#intro">填写说明</a>
    <a href="#form">开始登记</a>
  </nav>
  <main>
    <section id="intro">
      <h2>填写说明</h2>
      <p>带 * 号为必填项，借阅前请确认图书信息无误。</p>
    </section>
    <section id="form">
      <h2>借阅登记表单</h2>
      <form action="#" method="get">
        <p>
          <label for="name">姓名 *</label>
          <input type="text" id="name" name="name" placeholder="请输入姓名" required>
        </p>
        <p>
          <label for="studentid">学号 *</label>
          <input type="text" id="studentid" name="studentid" placeholder="请输入学号" required>
        </p>
        <p>
          <label for="department">院系 *</label>
          <input type="text" id="department" name="department" placeholder="请输入院系" required>
        </p>
        <p>
          <label for="phone">常用电话 *</label>
          <input type="text" id="phone" name="phone" placeholder="11位手机号" pattern="[0-9]{11}" required>
        </p>
        <p>
          <label for="mail">邮箱</label>
          <input type="email" id="mail" name="mail" placeholder="选填">
        </p>
        <p>
          <label for="bookname">图书名称 *</label>
          <input type="text" id="bookname" name="bookname" placeholder="请输入书名" required>
        </p>
        <p>
          <label for="number">借阅数量 *</label>
          <input type="number" id="number" name="number" min="1" value="1" required>
        </p>
        <p>
          <label for="returndate">归还时间 *</label>
          <input type="date" id="returndate" name="returndate" required>
        </p>
        <p>归还方式（可多选）</p>
        <p>
          <label><input type="checkbox" name="returnway" value="self"> 自取</label>
          <label><input type="checkbox" name="returnway" value="mail"> 邮寄</label>
        </p>
        <p>
          <label for="remark">备注</label><br>
          <textarea id="remark" name="remark" rows="3" placeholder="其他说明（选填）"></textarea>
        </p>
        <p>
          <button type="submit">提交登记</button>
        </p>
      </form>
    </section>
  </main>
  <footer>
    <p>软件开发综合实践 · 自主实践作品</p>
  </footer>
</body>
</html>
